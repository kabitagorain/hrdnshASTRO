<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Endpoint Not Found | Haradhan Sharma</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="The requested page or blueprint does not exist or has been relocated." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #030712;
        color: #f3f4f6;
        font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background-image: 
          radial-gradient(ellipse at 50% -20%, rgba(14, 165, 233, 0.15), transparent 70%),
          radial-gradient(ellipse at 80% 120%, rgba(99, 102, 241, 0.1), transparent 70%);
      }
      .card {
        background: rgba(17, 24, 39, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 1rem;
        max-width: 32rem;
        width: 100%;
        padding: 2.5rem 2rem;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      }
      .code {
        font-family: 'Roboto Mono', monospace;
        font-size: 0.875rem;
        color: #38bdf8;
        background: rgba(56, 189, 248, 0.1);
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        display: inline-block;
        margin-bottom: 1.25rem;
        border: 1px solid rgba(56, 189, 248, 0.2);
        letter-spacing: 0.05em;
      }
      h1 {
        font-size: 2.25rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        margin-bottom: 0.75rem;
        background: linear-gradient(135deg, #ffffff 0%, #9ca3af 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p {
        color: #9ca3af;
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      @media (min-width: 640px) {
        .actions {
          flex-direction: row;
          justify-content: center;
        }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s ease;
      }
      .btn-primary {
        background: #0284c7;
        color: #ffffff;
        box-shadow: 0 10px 15px -3px rgba(2, 132, 199, 0.3);
      }
      .btn-primary:hover {
        background: #0369a1;
        transform: translateY(-1px);
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        color: #e5e7eb;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="code">HTTP 404 // NOT_FOUND</div>
      <h1>Endpoint Not Found</h1>
      <p>The requested route, blueprint, or resource does not exist on this cluster or has been consolidated.</p>
      <div class="actions">
        <a href="/" class="btn btn-primary">Return to Overview</a>
        <a href="/services/" class="btn btn-secondary">Explore Blueprints</a>
      </div>
    </div>
  </body>
</html>
